        <button id="nav-salir" class="hidden md:block !hidden px-3 py-2 text-sm font-medium text-zinc-400 hover:text-white transition-colors shadow-none border-0 appearance-none">Salir</button>

        <i class="ph-bold ph-qr-code text-xl"></i> Escanear Placa
      </button>
      <button id="mobile-entrar" onclick="window.location.href='entrar.html'" class="block w-full text-base font-medium text-zinc-400 hover:text-white transition-colors text-left shadow-none border-0 appearance-none py-1 mt-2">Entrar</button>
      <button id="mobile-registro" onclick="window.location.href='registro.html'" class="sm:hidden bg-white text-brand text-base font-medium px-5 py-3 rounded-full hover:bg-surface transition-colors shadow-none border-0 appearance-none w-full text-center mt-2">Registro</button>

    </div>
  </header>
  <main class="w-full max-w-md mx-auto px-6 py-16 flex-1 flex flex-col justify-center">
    <div class="mb-10 text-center">
      <h1 class="text-3xl sm:text-4xl font-semibold tracking-tight mb-3 text-brand">Crea tu cuenta</h1>
      <p class="text-zinc-500 text-sm sm:text-base font-normal leading-relaxed">Únete a MascotaSegura y comienza a proteger a tus mejores amigos hoy mismo.</p>
    </div>
    <form class="flex flex-col gap-6">
      <div class="flex flex-col gap-2">
        <label for="fullname" class="text-sm font-medium text-brand">Nombre completo</label>
        <input type="text" id="fullname" placeholder="Ej. Juan Pérez" class="w-full bg-surface px-5 py-3.5 rounded-2xl outline-none focus:ring-2 focus:ring-brand/20 focus:bg-surfaceHover transition-colors text-sm font-normal placeholder-zinc-400 text-brand shadow-none appearance-none border-0" required>
      </div>
      <div class="flex flex-col gap-2">
        <label for="email" class="text-sm font-medium text-brand">Correo electrónico</label>
        <input type="email" id="email" placeholder="Ej. hola@correo.com" class="w-full bg-surface px-5 py-3.5 rounded-2xl outline-none focus:ring-2 focus:ring-brand/20 focus:bg-surfaceHover transition-colors text-sm font-normal placeholder-zinc-400 text-brand shadow-none appearance-none border-0" required>
      </div>
      <div class="flex flex-col gap-2">
        <label for="password" class="text-sm font-medium text-brand">Contraseña</label>
        <input type="password" id="password" placeholder="Crea una contraseña segura" class="w-full bg-surface px-5 py-3.5 rounded-2xl outline-none focus:ring-2 focus:ring-brand/20 focus:bg-surfaceHover transition-colors text-sm font-normal placeholder-zinc-400 text-brand shadow-none appearance-none border-0" required>
      </div>
      <button type="submit" id="btn-registro" class="mt-4 bg-brand text-white rounded-full py-4 text-base font-medium hover:bg-brandHover transition-colors w-full shadow-none border-0 appearance-none">
        Crear mi cuenta
      </button>
      <div class="mt-6 text-center">
        <span class="text-sm font-normal text-zinc-500">¿Ya tienes una cuenta? </span>
        <a href="entrar.html" class="text-sm font-medium text-brand hover:underline">Entra aquí</a>
      </div>
    </form>
  </main>
  <footer class="w-full mt-auto bg-white">
    <div class="max-w-6xl mx-auto px-6 py-8 md:py-12 flex flex-col md:flex-row justify-between items-center gap-6">
