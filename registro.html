<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Registro - MascotaSegura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        extend: {
          colors: {
            brand: '#000000',
            brandHover: '#333333',
            surface: '#F4F4F5',
            surfaceHover: '#E4E4E7',
            error: '#EF4444',
            success: '#22C55E',
            warning: '#F59E0B',
            secondary: '#6B7280'
          },
          spacing: { 'safe': 'env(safe-area-inset-bottom)' },
          borderRadius: { 'global': '8px' }
        }
      }
    }
  </script>
  <link rel="icon" type="image/svg+xml" href="assets/icons/paw-print-fill.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090B">
</head>
<body class="bg-white text-brand antialiased min-h-screen flex flex-col selection:bg-brand selection:text-white overflow-x-hidden pb-0">
  <header class="w-full flex items-center justify-center py-8">
    <a href="index.html" class="flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-brand/50 rounded-lg">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 fill-current text-brand" viewBox="0 0 256 256"><path d="M240,108a28,28,0,1,1-28-28A28,28,0,0,1,240,108ZM72,108a28,28,0,1,0-28,28A28,28,0,0,0,72,108ZM92,88A28,28,0,1,0,64,60,28,28,0,0,0,92,88Zm72,0a28,28,0,1,0-28-28A28,28,0,0,0,164,88Zm23.12,60.86a35.3,35.3,0,0,1-16.87-21.14,44,44,0,0,0-84.5,0A35.25,35.25,0,0,1,69,148.82,40,40,0,0,0,88,224a39.48,39.48,0,0,0,15.52-3.13,64.09,64.09,0,0,1,48.87,0,40,40,0,0,0,34.73-72Z"></path></svg>
      <span class="text-xl font-semibold tracking-tight text-brand">MascotaSegura</span>
    </a>
  </header>
  <main class="w-full max-w-md mx-auto px-6 py-16 flex-1 flex flex-col justify-center">
    <div class="mb-10 text-center">
      <h1 class="text-3xl sm:text-4xl font-semibold tracking-tight mb-3 text-brand">Crea tu cuenta</h1>
      <p class="text-zinc-500 text-sm sm:text-base font-normal leading-relaxed">Únete a MascotaSegura y comienza a proteger a tus mejores amigos hoy mismo.</p>
    </div>

    <form id="registro-form" class="flex flex-col gap-6">
        <div class="flex flex-col gap-2">
          <label for="fullname" class="text-sm font-medium text-brand">Nombre completo *</label>
          <input type="text" id="fullname" placeholder="Ej. Juan Pérez" class="w-full bg-surface px-5 py-3.5 rounded-lg outline-none focus:ring-2 focus:ring-brand/50 focus:bg-surfaceHover transition-colors text-sm font-normal placeholder-zinc-400 text-brand appearance-none" required>
        </div>
        <div class="flex flex-col gap-2">
          <label for="phone" class="text-sm font-medium text-brand">Teléfono principal *</label>
          <input type="tel" id="phone" placeholder="Ej. 555 123 4567" class="w-full bg-surface px-5 py-3.5 rounded-lg outline-none focus:ring-2 focus:ring-brand/50 focus:bg-surfaceHover transition-colors text-sm font-normal placeholder-zinc-400 text-brand appearance-none" required>
        </div>
        <div class="flex flex-col gap-2">
          <label for="phone_alt" class="text-sm font-medium text-brand">Teléfono de emergencia</label>
          <input type="tel" id="phone_alt" placeholder="Opcional" class="w-full bg-surface px-5 py-3.5 rounded-lg outline-none focus:ring-2 focus:ring-brand/50 focus:bg-surfaceHover transition-colors text-sm font-normal placeholder-zinc-400 text-brand appearance-none">
        </div>
        <div class="flex flex-col gap-2">
          <label for="city" class="text-sm font-medium text-brand">Ciudad y Estado *</label>
          <input type="text" id="city" placeholder="Ej. CDMX" class="w-full bg-surface px-5 py-3.5 rounded-lg outline-none focus:ring-2 focus:ring-brand/50 focus:bg-surfaceHover transition-colors text-sm font-normal placeholder-zinc-400 text-brand appearance-none" required>
        </div>
        <div class="flex flex-col gap-2">
          <label for="address" class="text-sm font-medium text-brand">Dirección</label>
          <input type="text" id="address" placeholder="Opcional" class="w-full bg-surface px-5 py-3.5 rounded-lg outline-none focus:ring-2 focus:ring-brand/50 focus:bg-surfaceHover transition-colors text-sm font-normal placeholder-zinc-400 text-brand appearance-none">
        </div>
        
        <div class="flex flex-col gap-2">
          <label for="email" class="text-sm font-medium text-brand">Correo electrónico *</label>
          <input type="email" id="email" placeholder="Ej. hola@correo.com" class="w-full bg-surface px-5 py-3.5 rounded-lg outline-none focus:ring-2 focus:ring-brand/50 focus:bg-surfaceHover transition-colors text-sm font-normal placeholder-zinc-400 text-brand appearance-none" required>
        </div>
        <div class="flex flex-col gap-2">
          <label for="password" class="text-sm font-medium text-brand">Contraseña *</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres" class="w-full bg-surface px-5 py-3.5 rounded-lg outline-none focus:ring-2 focus:ring-brand/50 focus:bg-surfaceHover transition-colors text-sm font-normal placeholder-zinc-400 text-brand appearance-none" required>
        </div>
        <div class="flex flex-col gap-2">
          <label for="password_confirm" class="text-sm font-medium text-brand">Confirmar Contraseña *</label>
          <input type="password" id="password_confirm" placeholder="Repite tu contraseña" class="w-full bg-surface px-5 py-3.5 rounded-lg outline-none focus:ring-2 focus:ring-brand/50 focus:bg-surfaceHover transition-colors text-sm font-normal placeholder-zinc-400 text-brand appearance-none" required>
        </div>
        
        <button type="submit" id="btn-registro" class="mt-4 bg-brand text-white rounded-lg py-4 text-base font-medium hover:bg-brandHover transition-colors w-full appearance-none">
          Crear cuenta
        </button>

      <div class="mt-6 flex flex-col items-center gap-4">
        <span class="text-sm font-normal text-zinc-500">¿Ya tienes una cuenta? <a href="entrar.html" class="font-medium text-brand hover:underline">Entra aquí</a></span>
      </div>
    </form>
  </main>


    <footer class="w-full mt-auto bg-white">
    <div class="max-w-6xl mx-auto px-6 py-8 flex flex-col md:flex-row justify-between items-center gap-6">
      <a href="index.html" class="flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-brand/50 rounded-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-current text-brand" viewBox="0 0 256 256"><path d="M240,108a28,28,0,1,1-28-28A28,28,0,0,1,240,108ZM72,108a28,28,0,1,0-28,28A28,28,0,0,0,72,108ZM92,88A28,28,0,1,0,64,60,28,28,0,0,0,92,88Zm72,0a28,28,0,1,0-28-28A28,28,0,0,0,164,88Zm23.12,60.86a35.3,35.3,0,0,1-16.87-21.14,44,44,0,0,0-84.5,0A35.25,35.25,0,0,1,69,148.82,40,40,0,0,0,88,224a39.48,39.48,0,0,0,15.52-3.13,64.09,64.09,0,0,1,48.87,0,40,40,0,0,0,34.73-72Z"></path></svg>
        <span class="text-base font-semibold tracking-tight text-brand">MascotaSegura</span>
      </a>
      <span class="text-sm text-zinc-400 font-normal">&copy; 2026 MascotaSegura. Todos los derechos reservados.</span>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/script.js"></script>
      
  </body>
</html>
